# Raspberry Pi print servers.
#
# ansible_become_pass is required: Raspberry Pi OS images created by the Pi
# Imager do NOT grant passwordless sudo. Supply it at run time instead of
# storing it here:
#     ansible-playbook site.yml --ask-become-pass
# or keep it in an ansible-vault encrypted group_vars file.

[printservers]
printserver.local ansible_user=pi

[printservers:vars]
ansible_python_interpreter=/usr/bin/python3
