# CUPS drives USB printers through its own libusb-based backend.
#
# The usblp kernel module claims the printer's USB interface and fights that
# backend for it: jobs then hang forever at "Sending data to printer" with
# nothing logged as an error, while dmesg shows usblp repeatedly registering
# and removing the device. Keeping usblp out of the way is what makes USB
# printing work at all.
#
# Managed by Ansible - local edits will be overwritten.
blacklist usblp
